name: hosply-production

services:
  web:
    build: .
    container_name: hosply-prod
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-prod
    restart: always
    environment:
      - SCRIPT_NAME=/pgadmin
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    container_name: postgres-db-prod
    restart: always
    env_file:
      - .env
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" 

  caddy:
    image: caddy:alpine
    container_name: caddy-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    depends_on:
      - db
      - pgadmin
      - web

volumes:
  pgadmin_data_prod:
  pg_data_prod:
  caddy_data_prod:
  caddy_config_prod: